<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Card For You ✿</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Kalam:wght@300;400;700&family=Indie+Flower&family=Satisfy&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  background-color: #d6ecf8;
  background-image: repeating-linear-gradient(
    to right,
    #d6ecf8 0px, #d6ecf8 28px,
    #ffffff 28px, #ffffff 56px
  );
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2.5rem 1rem 5rem;
}

.app { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }

/* PAGE HEADER */
.page-header { text-align: center; margin-bottom: 1.8rem; }
.page-header h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 700;
  color: #1b3f6e;
  line-height: 1;
}
.page-header p {
  font-size: 0.82rem;
  font-style: italic;
  letter-spacing: 0.08em;
  color: #5a86b8;
  margin-top: 0.3rem;
  font-weight: 300;
}

/* LOADING */
.loading-msg {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: #5a86b8;
  margin-top: 2rem;
}

/* TABS */
.tabs {
  display: flex;
  background: rgba(255,255,255,0.75);
  border-radius: 100px;
  padding: 4px;
  margin-bottom: 1.75rem;
  box-shadow: 0 2px 12px rgba(27,63,110,0.08);
  backdrop-filter: blur(8px);
}
.tab-btn {
  font-family: 'Nunito', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 0.5rem 1.4rem;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  color: #5a86b8;
}
.tab-btn.active { background: #1b3f6e; color: white; box-shadow: 0 2px 8px rgba(27,63,110,0.25); }
.tab-btn:hover:not(.active) { color: #1b3f6e; background: rgba(27,63,110,0.07); }

/* WRITE PANEL */
.write-panel {
  width: 100%;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  box-shadow: 0 4px 32px rgba(27,63,110,0.1), 0 1px 4px rgba(27,63,110,0.06);
  padding: 2rem 2.25rem;
  animation: rise 0.3s ease;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.write-panel h2 {
  font-family: 'Caveat', cursive;
  font-size: 1.7rem;
  font-weight: 700;
  color: #1b3f6e;
  margin-bottom: 0.2rem;
}
.write-panel .sub {
  font-size: 0.8rem;
  color: #7a9fc0;
  margin-bottom: 1.75rem;
  font-weight: 300;
  font-style: italic;
}

.field { margin-bottom: 1.35rem; }
.field-label {
  display: block;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #7a9fc0;
  margin-bottom: 0.45rem;
}

.clean-input {
  width: 100%;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  color: #1b3f6e;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid #ccdff0;
  padding: 0.45rem 0;
  outline: none;
  transition: border-color 0.2s;
}
.clean-input:focus { border-color: #1b3f6e; }
.clean-input::placeholder { color: #aac4dc; font-weight: 300; }

textarea.clean-input {
  border: 1.5px solid #ccdff0;
  border-radius: 10px;
  padding: 0.6rem 0.75rem;
  min-height: 110px;
  resize: vertical;
  line-height: 1.65;
}
textarea.clean-input:focus { border-color: #1b3f6e; }

.char-count { font-size: 0.68rem; color: #aac4dc; text-align: right; margin-top: 0.25rem; }

/* Font picker */
.font-picker { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.35rem; }
.font-option {
  padding: 0.35rem 0.9rem;
  border-radius: 100px;
  border: 1.5px solid #ccdff0;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.15s;
  background: white;
  color: #3a6090;
  line-height: 1;
}
.font-option.selected { border-color: #e8c830; background: #f6d860; color: #1b3f6e; }
.font-option:hover:not(.selected) { border-color: #7aaed0; background: #f0f7ff; }

/* Form footer */
.form-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.75rem;
  padding-top: 1.25rem;
  border-top: 1px solid #e8f2fa;
}

.note-count {
  font-size: 0.75rem;
  color: #7a9fc0;
  font-weight: 300;
  font-style: italic;
}
.note-count strong { color: #1b3f6e; font-style: normal; font-weight: 600; }

.btn-add {
  font-family: 'Nunito', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0.6rem 1.6rem;
  background: #f6d860;
  color: #1b3f6e;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 10px rgba(220,190,40,0.25);
}
.btn-add:hover:not(:disabled) { background: #f5cf3a; box-shadow: 0 4px 16px rgba(220,190,40,0.35); transform: translateY(-1px); }
.btn-add:active { transform: translateY(0); }
.btn-add:disabled { opacity: 0.4; cursor: not-allowed; }

.toast {
  font-size: 0.8rem;
  color: #7a5a10;
  background: #fef9d6;
  border: 1px solid #f0d860;
  border-radius: 8px;
  padding: 0.6rem 0.9rem;
  margin-top: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  animation: rise 0.2s ease;
}

.error-banner {
  font-size: 0.78rem;
  color: #c05050;
  background: #fff0f0;
  border: 1px solid #f0c0c0;
  border-radius: 8px;
  padding: 0.6rem 0.9rem;
  margin-top: 0.75rem;
  animation: rise 0.2s ease;
}

/* Setup accordion */
.setup-toggle {
  font-size: 0.72rem;
  color: #aac4dc;
  cursor: pointer;
  margin-top: 1.25rem;
  padding-top: 1.25rem;
  border-top: 1px dashed #dceef8;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  user-select: none;
  transition: color 0.2s;
}
.setup-toggle:hover { color: #1b3f6e; }

.setup-body {
  margin-top: 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: flex-end;
}
.setup-body .field { flex: 1; min-width: 140px; margin-bottom: 0; }

.btn-save {
  font-family: 'Nunito', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.5rem 1.2rem;
  border: 1.5px solid #ccdff0;
  border-radius: 100px;
  background: white;
  color: #1b3f6e;
  cursor: pointer;
  transition: all 0.15s;
  align-self: flex-end;
}
.btn-save:hover { border-color: #1b3f6e; background: #f0f7ff; }
.setup-hint { font-size: 0.7rem; color: #aac4dc; margin-top: 0.5rem; font-style: italic; }

/* OPEN PANEL */
.open-panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.25rem; animation: rise 0.3s ease; }

.card-scene { perspective: 1600px; width: 420px; max-width: 100%; position: relative; }
.card-wrapper { width: 420px; max-width: 100%; position: relative; }

/* Cover */
.card-cover {
  width: 420px;
  max-width: 100%;
  background: #fffef0;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(27,63,110,0.15), 0 2px 8px rgba(27,63,110,0.08);
  overflow: hidden;
  transform-origin: left center;
  transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
  transform: rotateY(0deg);
  backface-visibility: hidden;
  position: relative;
  z-index: 2;
}
.card-cover.is-open { transform: rotateY(-168deg); pointer-events: none; }

.cover-inner { padding: 0; position: relative; overflow: hidden; }
.cover-img { width: 100%; display: block; object-fit: cover; object-position: center top; }

.cover-text-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(255,253,236,0.98) 55%, transparent 100%);
  padding: 2rem 2rem 1.5rem;
  text-align: center;
}
.cover-title {
  font-family: 'Caveat', cursive;
  font-size: 2.4rem;
  font-weight: 700;
  color: #1b3f6e;
  line-height: 1.1;
  margin-bottom: 0.2rem;
}
.cover-sub {
  font-family: 'Nunito', sans-serif;
  font-size: 0.75rem;
  font-weight: 300;
  font-style: italic;
  letter-spacing: 0.1em;
  color: #7aaed0;
}

/* Inside */
.card-inside {
  position: absolute;
  top: 0; left: 0;
  width: 420px;
  max-width: 100%;
  min-height: 100%;
  background: #fffef5;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 27px,
    rgba(180,210,230,0.2) 27px, rgba(180,210,230,0.2) 28px
  );
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(27,63,110,0.12);
  z-index: 1;
  overflow: hidden;
}
.inside-content {
  padding: 1.75rem 1.75rem 2rem;
  opacity: 0;
  transition: opacity 0.3s ease 0.5s;
}
.inside-content.visible { opacity: 1; }

.inside-header {
  text-align: center;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px dashed rgba(90,134,184,0.25);
}
.inside-for {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #8ab4d4;
  margin-bottom: 0.25rem;
}
.inside-name {
  font-family: 'Caveat', cursive;
  font-size: 2.2rem;
  font-weight: 700;
  color: #1b3f6e;
  line-height: 1;
}
.inside-from {
  font-size: 0.75rem;
  color: #8ab4d4;
  margin-top: 0.3rem;
  font-style: italic;
  font-weight: 300;
}

/* Signatures */
.signatures-grid { columns: 2; column-gap: 1.25rem; }
.signature-block {
  break-inside: avoid;
  margin-bottom: 1.5rem;
  display: block;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.sig-message { line-height: 1.55; color: #2a3a50; white-space: pre-wrap; font-size: 1.05rem; }
.sig-name { margin-top: 0.4rem; font-size: 0.85rem; color: #7aaed0; font-style: italic; }

.inside-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px dashed rgba(90,134,184,0.25);
}
.inside-count { font-size: 0.72rem; color: #8ab4d4; font-style: italic; }
.inside-count strong { color: #1b3f6e; font-style: normal; }

.btn-relock {
  font-family: 'Nunito', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 0.4rem 1rem;
  border: 1px solid #ccdff0;
  border-radius: 100px;
  background: white;
  color: #5a86b8;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-relock:hover { border-color: #5a86b8; }

/* Password form */
.pw-form {
  width: 420px;
  max-width: 100%;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 1.5rem 2rem;
  box-shadow: 0 2px 16px rgba(27,63,110,0.08);
  border: 1px solid rgba(214,236,248,0.6);
  text-align: center;
}
.pw-form p { font-size: 0.78rem; color: #7aaed0; margin-bottom: 1rem; font-style: italic; font-weight: 300; }

.pw-row { display: flex; gap: 0.6rem; max-width: 320px; margin: 0 auto; }
.pw-row .clean-input { font-family: 'Nunito'; letter-spacing: 0.08em; }

.btn-open {
  font-family: 'Nunito', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.55rem 1.4rem;
  background: #f6d860;
  color: #1b3f6e;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(220,190,40,0.25);
}
.btn-open:hover:not(:disabled) { background: #f5cf3a; }
.btn-open:disabled { opacity: 0.6; cursor: not-allowed; }

.pw-error { font-size: 0.72rem; color: #c05050; margin-top: 0.6rem; min-height: 1.1em; }
.no-sig { text-align: center; padding: 2rem 1rem; font-size: 0.85rem; color: #8ab4d4; font-style: italic; }

@media (max-width: 460px) {
  .card-cover, .card-inside, .card-scene, .card-wrapper, .pw-form { width: 100%; }
  .signatures-grid { columns: 1; }
  .write-panel { padding: 1.5rem 1.25rem; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── SUPABASE CONFIG ────────────────────────────────────────────────────────
// Replace these two values with your own from supabase.com → Project Settings → API
const SUPABASE_URL      = 'https://YOUR_PROJECT_ID.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
// ──────────────────────────────────────────────────────────────────────────

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── DATA LAYER ─────────────────────────────────────
async function fetchAll() {
  const [notesRes, cfgRes] = await Promise.all([
    db.from('notes').select('id, name, message, font, created_at').order('created_at'),
    db.from('card_settings').select('password, recipient').eq('id', 1).maybeSingle(),
  ]);
  if (notesRes.error) throw notesRes.error;
  return {
    notes:     notesRes.data ?? [],
    password:  cfgRes.data?.password  ?? 'open',
    recipient: cfgRes.data?.recipient ?? '',
  };
}

async function dbInsertNote({ name, message, font }) {
  const { data, error } = await db.from('notes').insert({ name, message, font }).select().single();
  if (error) throw error;
  return data;
}

async function dbSaveSettings({ password, recipient }) {
  const { error } = await db.from('card_settings').upsert({ id: 1, password, recipient });
  if (error) throw error;
}

// ── CONSTANTS ──────────────────────────────────────
const FONTS = [
  { id: 'caveat',         family: "'Caveat', cursive",         label: 'Casual'   },
  { id: 'dancing-script', family: "'Dancing Script', cursive", label: 'Cursive'  },
  { id: 'kalam',          family: "'Kalam', cursive",          label: 'Natural'  },
  { id: 'indie-flower',   family: "'Indie Flower', cursive",   label: 'Friendly' },
  { id: 'satisfy',        family: "'Satisfy', cursive",        label: 'Elegant'  },
];

const ROTS = [-2.2, 1.6, -1.0, 2.4, -1.8, 1.2, -2.6, 2.0, -1.4, 1.8];

// ── WRITE PANEL ────────────────────────────────────
function WritePanel({ state, setState }) {
  const [name, setName]     = useState('');
  const [msg, setMsg]       = useState('');
  const [font, setFont]     = useState(FONTS[0].id);
  const [toast, setToast]   = useState(false);
  const [adding, setAdding] = useState(false);
  const [addErr, setAddErr] = useState('');
  const [setup, setSetup]   = useState(false);
  const [pw, setPw]         = useState('');
  const [rec, setRec]       = useState(state.recipient || '');
  const timer               = useRef();

  async function addNote() {
    if (!name.trim() || !msg.trim() || adding) return;
    setAdding(true);
    setAddErr('');
    try {
      const note = await dbInsertNote({ name: name.trim(), message: msg.trim(), font });
      setState(prev => ({ ...prev, notes: [...prev.notes, note] }));
      setName(''); setMsg('');
      clearTimeout(timer.current);
      setToast(true);
      timer.current = setTimeout(() => setToast(false), 3000);
    } catch {
      setAddErr('Something went wrong — please try again.');
    } finally {
      setAdding(false);
    }
  }

  async function saveSetup() {
    const newPw  = pw.trim()  || state.password;
    const newRec = rec.trim() || state.recipient;
    try {
      await dbSaveSettings({ password: newPw, recipient: newRec });
      setState(prev => ({ ...prev, password: newPw, recipient: newRec }));
    } catch {
      // silently fail — non-critical
    }
    setPw(''); setSetup(false);
  }

  const fontFamily = FONTS.find(f => f.id === font)?.family || FONTS[0].family;

  return (
    <div className="write-panel">
      <h2>Leave a note ✿</h2>
      <p className="sub">Your message will appear inside when the card is opened.</p>

      <div className="field">
        <label className="field-label">Your name</label>
        <input className="clean-input" type="text" value={name}
          onChange={e => setName(e.target.value)} placeholder="e.g. Sarah" maxLength={40} />
      </div>

      <div className="field">
        <label className="field-label">Choose your handwriting</label>
        <div className="font-picker">
          {FONTS.map(f => (
            <button key={f.id}
              className={`font-option ${font === f.id ? 'selected' : ''}`}
              style={{ fontFamily: f.family }}
              onClick={() => setFont(f.id)}>
              {f.label}
            </button>
          ))}
        </div>
      </div>

      <div className="field">
        <label className="field-label">Your message</label>
        <textarea className="clean-input" value={msg}
          onChange={e => setMsg(e.target.value)}
          placeholder="Write something from the heart…"
          maxLength={500}
          style={{ fontFamily }}></textarea>
        <div className="char-count">{msg.length} / 500</div>
      </div>

      <div className="form-footer">
        <span className="note-count">
          <strong>{state.notes.length}</strong> {state.notes.length === 1 ? 'note' : 'notes'} so far
        </span>
        <button className="btn-add" onClick={addNote} disabled={!name.trim() || !msg.trim() || adding}>
          {adding ? 'Adding…' : 'Add my note →'}
        </button>
      </div>

      {toast    && <div className="toast">✓ Your note has been added!</div>}
      {addErr   && <div className="error-banner">{addErr}</div>}

      <div className="setup-toggle" onClick={() => setSetup(s => !s)}>
        <span style={{ fontSize: '0.6rem' }}>{setup ? '▾' : '▸'}</span>
        Set up the card (recipient name + password)
      </div>

      {setup && (
        <div>
          <div className="setup-body">
            <div className="field">
              <label className="field-label">Recipient's name</label>
              <input className="clean-input" type="text" value={rec}
                onChange={e => setRec(e.target.value)} placeholder="e.g. Alex" maxLength={40} />
            </div>
            <div className="field">
              <label className="field-label">Password to open card</label>
              <input className="clean-input" type="text" value={pw}
                onChange={e => setPw(e.target.value)} placeholder="e.g. flowers2024" maxLength={40} />
            </div>
            <button className="btn-save" onClick={saveSetup}>Save</button>
          </div>
          <p className="setup-hint">Default password is <strong>open</strong>. Share only with the recipient.</p>
        </div>
      )}
    </div>
  );
}

// ── OPEN PANEL ─────────────────────────────────────
function OpenPanel({ state, reload }) {
  const [attempt,        setAttempt]        = useState('');
  const [error,          setError]          = useState('');
  const [opening,        setOpening]        = useState(false);
  const [opened,         setOpened]         = useState(false);
  const [contentVisible, setContentVisible] = useState(false);

  async function tryOpen() {
    if (opening) return;
    setOpening(true);
    setError('');
    try {
      const fresh = await reload();
      if (!fresh.password) { setError('No password set yet.'); return; }
      if (attempt !== fresh.password) {
        setError("That's not quite right — try again.");
        setAttempt(''); return;
      }
      setOpened(true);
      setTimeout(() => setContentVisible(true), 500);
    } catch {
      setError('Connection error — please try again.');
    } finally {
      setOpening(false);
    }
  }

  function relock() { setOpened(false); setContentVisible(false); setAttempt(''); setError(''); }

  return (
    <div className="open-panel">
      <div className="card-scene">
        <div className="card-wrapper" style={{ overflow: opened ? 'visible' : 'hidden' }}>

          <div className="card-inside">
            <div className={`inside-content ${contentVisible ? 'visible' : ''}`}>
              <div className="inside-header">
                <div className="inside-for">A card for</div>
                <div className="inside-name">{state.recipient || 'You'}</div>
                <div className="inside-from">— from all of us, with love</div>
              </div>

              {state.notes.length === 0 ? (
                <div className="no-sig">No messages yet — ask your team to write one!</div>
              ) : (
                <div className="signatures-grid">
                  {state.notes.map((n, i) => {
                    const f   = FONTS.find(f => f.id === n.font) || FONTS[0];
                    const rot = ROTS[i % ROTS.length];
                    return (
                      <div className="signature-block" key={n.id} style={{
                        opacity: contentVisible ? 1 : 0,
                        transform: contentVisible
                          ? `rotate(${rot}deg)`
                          : `rotate(${rot}deg) translateY(8px)`,
                        transitionDelay: `${0.1 + i * 0.06}s`,
                      }}>
                        <div className="sig-message" style={{ fontFamily: f.family }}>{n.message}</div>
                        <div className="sig-name"    style={{ fontFamily: f.family }}>— {n.name}</div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="inside-footer">
                <div className="inside-count">
                  <strong>{state.notes.length}</strong> {state.notes.length === 1 ? 'person' : 'people'} signed this card
                </div>
                <button className="btn-relock" onClick={relock}>🔒 Lock again</button>
              </div>
            </div>
          </div>

          <div className={`card-cover ${opened ? 'is-open' : ''}`}>
            <div className="cover-inner">
              <img className="cover-img"
                src="project/uploads/Screenshot 2026-04-29 at 10.12.08 AM.png"
                alt="Hand holding flowers" />
              <div className="cover-text-overlay">
                <div className="cover-title">they're for you!</div>
                <div className="cover-sub">a little card from everyone who loves you</div>
              </div>
            </div>
          </div>

        </div>
      </div>

      {!opened && (
        <div className="pw-form">
          <p>Enter the password your friend shared with you to open the card</p>
          <div className="pw-row">
            <input className="clean-input" type="password" value={attempt}
              onChange={e => setAttempt(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && tryOpen()}
              placeholder="Password" />
            <button className="btn-open" onClick={tryOpen} disabled={opening}>
              {opening ? '…' : 'Open ✿'}
            </button>
          </div>
          {error && <div className="pw-error">{error}</div>}
        </div>
      )}
    </div>
  );
}

// ── APP ────────────────────────────────────────────
function App() {
  const [tab,     setTab]     = useState('write');
  const [state,   setState]   = useState({ notes: [], password: 'open', recipient: '' });
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState('');

  async function reload() {
    const data = await fetchAll();
    setState(data);
    return data;
  }

  useEffect(() => {
    fetchAll()
      .then(data => { setState(data); setLoading(false); })
      .catch(() => { setLoadErr('Could not connect — check your Supabase config.'); setLoading(false); });
  }, []);

  if (loading) {
    return (
      <div className="app">
        <div className="page-header">
          <h1>✿ A card for you ✿</h1>
          <p>from all of us · with love</p>
        </div>
        <div className="loading-msg">Loading…</div>
      </div>
    );
  }

  if (loadErr) {
    return (
      <div className="app">
        <div className="page-header">
          <h1>✿ A card for you ✿</h1>
        </div>
        <div className="error-banner" style={{ width: '100%', textAlign: 'center' }}>{loadErr}</div>
      </div>
    );
  }

  return (
    <div className="app">
      <div className="page-header">
        <h1>✿ A card for you ✿</h1>
        <p>from all of us · with love</p>
      </div>

      <div className="tabs">
        <button className={`tab-btn ${tab === 'write' ? 'active' : ''}`} onClick={() => setTab('write')}>
          ✏ Write a message
        </button>
        <button className={`tab-btn ${tab === 'view' ? 'active' : ''}`} onClick={() => setTab('view')}>
          🌸 Open the card
        </button>
      </div>

      {tab === 'write' && <WritePanel key="w" state={state} setState={setState} />}
      {tab === 'view'  && <OpenPanel  key="v" state={state} reload={reload} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
